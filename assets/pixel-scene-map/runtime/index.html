<!doctype html><meta charset="utf-8"><title>像素街区 · 静音工程预览</title>
<style>html,body{margin:0;background:#111528;color:#e8dcc1;font:15px system-ui}canvas{display:block;max-height:90vh;max-width:100vw;width:auto;margin:auto}#ui{padding:15px;display:flex;justify-content:center;gap:15px}button{background:#ffb863;border:0;padding:8px 20px;border-radius:8px}body.render #ui{display:none}body.render canvas{max-height:none;max-width:none}</style>
<canvas id="c"></canvas><div id="ui"><button id="play">静音播放 / 暂停</button><input id="scrub" type="range" min="0" step="0.0333333" value="0"><span id="tt">0</span></div>
<script src="vendor/util.js"></script><script>
const name=new URLSearchParams(location.search).get('film')||'caesar';
if(!/^[a-z0-9_-]+$/.test(name))throw new Error('Invalid film ID');
fetch('films/'+name+'.json').then(r=>{if(!r.ok)throw new Error('Missing film config');return r.json()}).then(async f=>{window.FILM=f;for(const src of ['scene-runtime.js','vendor/engine.js'])await new Promise((ok,no)=>{let e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.body.appendChild(e);});}).catch(e=>{window.__bootFailed=String(e)});
</script>
